version: 1
name: duo
repo: path:/abs/path/to/your/repo   # 改成你的仓库；原样记录，供后续阶段使用
norms: NORMS.md
lead: builder
posts:
  - id: builder
    agent: claude
    model: opus
    worktree: current               # current，或 Orca 的 worktree 选择器
    brief: [briefs/builder.md]
  - id: checker
    agent: codex
    # 无人值守时建议用不弹交互确认的权限模式（见 README「无人值守时的权限模式」），避免岗位停在确认框上
    launch: 'codex --model gpt-6-astra -c model_reasoning_effort="high"'
    worktree: current
    brief: [briefs/checker.md]

# 巡查与通知（可选；整段不写则全部用默认值）。改完要重新运行 wl up，调度员才会采用新规格。
# patrol:
#   no_progress_minutes: 20     # 岗位有进行中的任务但终端这么久没有新输出 → 视为"无进展"
#   prompt_minutes: 5           # 停在确认/选择提示上这么久 → 通知人去处理
#   owner_idle_minutes: 30      # 任务已就绪、主人迟迟不开始的等待时长
#   post_failure_streak: 3      # 同一岗位连续这么多个任务以 gate 失败收场 → 升级
#   freeze_lead: false          # true 时牵头岗也可能被自动冻结（默认不冻结牵头岗）
#   auto_recover: false         # true 时对"派发失主"的任务自动执行 wl task recover
#   worktree_comment: false     # true 时把各岗位的当前任务与告警标记同步成 worktree 的卡片注释
#   workspace_status: true      # true（默认）时同步岗位所在 worktree 的工作区状态（需要调度员在运行）
#   notify:                     # 外部通知通道，webhook 与 command 二选一
#     webhook: https://example.com/hook
#     # command: ['/usr/local/bin/terminal-notifier', '-title', 'Wingline', '-message']   # 消息作为最后一个参数追加
